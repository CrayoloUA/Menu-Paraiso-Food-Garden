<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a2e1a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <title>Paraíso Food Garden · Unicentro Cali</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-paradiso.svg" />
  <link rel="apple-touch-icon" href="assets/logo-paradiso.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Pinyon Script subsetado: solo los caracteres de "Paraíso Food Garden" -->
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&text=Para%C3%ADso%20Food%20Garden&family=Montserrat:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- SPLASH DE BIENVENIDA -->
  <div id="splash" class="splash" aria-hidden="true">
    <img src="assets/logo-paradiso.svg" alt="" class="splash-logo" />
    <p class="splash-bienvenido">Bienvenido a</p>
    <p class="splash-titulo">Paraíso Food Garden</p>
    <p class="splash-lugar">Unicentro · Cali</p>
  </div>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <img src="assets/logo-paradiso.svg" alt="Paraíso Food Garden" class="header-logo" />
      <h1 class="header-title">Paraíso Food Garden</h1>
      <p class="header-subtitle">Descubre nuestros sabores</p>
    </div>
  </header>

  <!-- GRILLA DE NEGOCIOS -->
  <main>
    <section class="negocios-grid" id="negocios-grid">
      <!-- Las tarjetas se inyectan dinámicamente desde app.js -->
    </section>
  </main>

  <!-- MODAL / LIGHTBOX -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-nombre-text">
    <div class="modal-content" id="modal-content">
      <button class="modal-close" id="modal-close" aria-label="Cerrar menú">&#x2715;</button>
      <!-- La imagen o iframe se inyecta dinámicamente -->
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="site-footer">
    <p>Paraíso Food Garden &middot; Unicentro Cali</p>
  </footer>

  <script src="menus.js"></script>
  <script src="negocios.js"></script>
  <script src="app.js"></script>
</body>
</html>
